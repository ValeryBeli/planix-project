spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      schema-locations: classpath:/test-schema.sql

  h2:
    console:
      enabled: false